name: dotnet test (suspect path)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plan:
    # On main / manual runs every scope runs. On a pull request from a `demo/<scope>`
    # branch only that scope runs, so the PR's Files changed tab shows just that scenario.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          all='[
            {"scope":"project","command":"dotnet test --project src/Repro/Repro.csproj --no-build -c Release --report-gh --report-gh-slow-test-threshold 1s"},
            {"scope":"solution","command":"dotnet test --solution GitHubActionsReport.POC.slnx --no-build -c Release --report-gh --report-gh-slow-test-threshold 1s"},
            {"scope":"bare","command":"dotnet test --no-build -c Release --report-gh --report-gh-slow-test-threshold 1s"}
          ]'
          if [[ "$EVENT" == "pull_request" && "$HEAD_REF" == demo/* ]]; then
            scope="${HEAD_REF#demo/}"
            matrix=$(jq -c --arg s "$scope" '[.[] | select(.scope == $s)]' <<<"$all")
          else
            matrix=$(jq -c . <<<"$all")
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  dotnet-test:
    name: dotnet test (${{ matrix.scope }})
    needs: plan
    # Skip when a demo/<other> PR (e.g. demo/exe-direct) selected no dotnet-test scope.
    if: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).include) != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release

      # Fails() is red on purpose.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: ${{ matrix.command }} 2>&1 | tee out.txt

      - name: Proof
        if: always()
        env:
          LABEL: dotnet test (${{ matrix.scope }})
          COMMAND: ${{ matrix.command }}
        run: ./.github/scripts/proof.sh out.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: out-dotnet-test-${{ matrix.scope }}
          path: out.txt
