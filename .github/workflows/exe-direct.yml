name: test exe direct (control)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  exe-direct:
    name: test exe direct
    # On a pull request only the demo/exe-direct branch runs this, so each demo PR isolates one scenario.
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'demo/exe-direct' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release

      # Fails() is red on purpose.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./src/Repro/bin/Release/net10.0/Repro --report-gh --report-gh-slow-test-threshold 1s 2>&1 | tee out.txt

      - name: Proof
        if: always()
        env:
          LABEL: test exe direct
          COMMAND: ./src/Repro/bin/Release/net10.0/Repro --report-gh --report-gh-slow-test-threshold 1s
        run: ./.github/scripts/proof.sh out.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-exe-direct
          path: out.txt
